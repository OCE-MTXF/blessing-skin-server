name: Build release candidate (no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout the selected tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build the pinned archive toolchain
        run: docker build --target toolchain --tag blessing-ci:release-builder .
      - name: Build archive and local SHA-256 manifest
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Select a reviewed numeric release tag.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/blessing-output"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" --volume "$RUNNER_TEMP/blessing-output:/output" \
            blessing-ci:release-builder php ./tools/release.php build /workspace /output "$GITHUB_REF_NAME" /usr/local/bin/composer
          cp "$RUNNER_TEMP/blessing-output"/blessing-skin-server-*.zip* "$GITHUB_WORKSPACE/"
      - name: Attach workflow artifact for review (not a release)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: blessing-reviewed-candidate
          path: |
            blessing-skin-server-*.zip
            blessing-skin-server-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
