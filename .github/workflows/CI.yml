name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build pinned PHP and frontend toolchain
        run: docker build --target toolchain --tag blessing-ci:toolchain .
      - name: Run dependency checks and isolated tests
        run: |
          mkdir -p "$RUNNER_TEMP/blessing-ci"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/blessing-ci"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP/blessing-ci:/workspace" \
            --env COMPOSER_HOME=/tmp/composer --env NPM_CONFIG_CACHE=/tmp/npm \
            --env APP_ENV=testing --env APP_DEBUG=false --env APP_URL=http://localhost \
            --env DB_CONNECTION=sqlite --env DB_DATABASE=:memory: \
            blessing-ci:toolchain sh -eu -c '
              mkdir -p bootstrap/cache
              composer validate --strict --no-check-publish
              composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
              composer check-platform-reqs
              composer audit --locked --no-interaction
              php artisan package:discover --no-interaction --no-ansi
              find app bootstrap config database routes tests tools -name "*.php" -print0 | xargs -0 -n1 php -l
              npm ci --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
              npm audit --registry=https://registry.npmjs.org
              npm run lint
              npm run type:check
              npm test -- --runInBand
              npm run build
              php vendor/bin/phpunit
            '
      - name: Build the unprivileged runtime image
        run: docker build --tag blessing-ci:runtime .
      - name: Confirm clean runtime is closed and health is read-only
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' blessing-ci:runtime)" = www-data
          container=$(docker run --rm --detach --read-only -p 127.0.0.1::8080 \
            --tmpfs /tmp:rw,nosuid,nodev --tmpfs /var/lib/blessing:rw,nosuid,nodev,uid=33,gid=33,mode=0700 \
            --env APP_URL=https://skin.example.test --env DB_CONNECTION=sqlite --env DB_DATABASE=/var/lib/blessing/smoke.sqlite \
            blessing-ci:runtime)
          trap 'docker stop "$container" >/dev/null || true' EXIT
          endpoint=$(docker port "$container" 8080/tcp)
          status=$(curl --retry 12 --retry-connrefused --retry-delay 1 --max-time 5 \
            -sS -o "$RUNNER_TEMP/blessing-health.txt" -w '%{http_code}' "http://$endpoint/healthz")
          test "$status" = 503
          grep -Fxq 'Service Unavailable' "$RUNNER_TEMP/blessing-health.txt"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://$endpoint/setup")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://$endpoint/app/favicon.ico")" = 200
